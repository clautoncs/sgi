services:
  app:
    build: .
    container_name: sgi
    restart: unless-stopped
    # Carrega as variáveis de ambiente (inclui a DATABASE_URL do TiDB).
    env_file:
      - .env
    # Publica a porta só no localhost do VPS; quem fala com o mundo é o Nginx.
    ports:
      - "127.0.0.1:3000:3000"
