services:
  app:
    build: .
    container_name: sgi
    restart: unless-stopped
    # Publica a porta SÓ no localhost do VPS (127.0.0.1).
    # Quem fala com o mundo é o Nginx; o container fica protegido atrás dele.
    ports:
      - "127.0.0.1:3000:3000"
