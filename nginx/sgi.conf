server {
    listen 80;
    server_name sgi.ilinked.com.br;

    location / {
        # Repassa as requisições para o container do app (porta 3000 no localhost).
        proxy_pass http://127.0.0.1:3000;

        # Cabeçalhos que o Next.js precisa para saber o endereço/protocolo real.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSocket (usado em recursos interativos do app).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
